services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cinescope-frontend:latest
    container_name: cinescope-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
